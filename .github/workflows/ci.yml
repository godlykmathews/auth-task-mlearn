name: Authentication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production server and check authentication
        run: |
          npm start > /tmp/harbor-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then break; fi
            sleep 1
          done
          TEST_EXPECT_SECURE=true npm run test:integration
          npm run test:browser
